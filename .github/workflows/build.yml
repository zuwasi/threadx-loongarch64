name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14-loongarch64-linux-gnu binutils-loongarch64-linux-gnu \
            cmake ninja-build

      - name: Build (${{ matrix.build_type }})
        run: tools/build.sh ${{ matrix.build_type }}
