nters shall only be applied to pointers that address elements of the same array"}], "top_files": [{"file": "tx_misra.c", "count": 40}, {"file": "tx_timer_initialize.c", "count": 23}, {"file": "tx_thread_initialize.c", "count": 20}, {"file": "tx_thread_performance_system_info_get.c", "count": 14}, {"file": "tx_mutex_performance_system_info_get.c", "count": 13}, {"file": "tx_timer_deactivate.c", "count": 13}, {"file": "tx_timer_info_get.c", "count": 13}, {"file": "txe_thread_create.c", "count": 13}], "devs": [{"id": "DEV-001", "title": "Freestanding memory functions use standard library names", "guideline": "Rule 5.10", "covered": ["Rule 5.10"], "required": true, "status": "Conditionally approved by safety manager; technical lead approval pending (see section 5)"}, {"id": "DEV-002", "title": "ThreadX internal identifiers use the reserved `_tx_` prefix", "guideline": "Rule 5.10", "covered": ["Rule 5.10"], "required": true, "status": "Draft (approval pending)"}, {"id": "DEV-003", "title": "ThreadX API basic types use the names fixed by `tx_api.h`", "guideline": "Dir 4.6", "covered": ["Dir 4.6"], "required": false, "status": "Draft (approval pending)"}, {"id": "DEV-004", "title": "ThreadX extension hooks are function-like macros", "guideline": "Dir 4.9", "covered": ["Dir 4.9"], "required": false, "status": "Draft (approval pending)"}, {"id": "DEV-005", "title": "ThreadX-mandated identifiers exceed the C90/C99 translation limits", "guideline": "Rule 1.1", "covered": ["Rule 1.1"], "required": true, "status": "Draft (approval pending)"}, {"id": "DEV-006", "title": "Functions implemented in assembly have no C definition", "guideline": "Rule 8.6", "covered": ["Rule 8.6"], "required": true, "status": "Draft (approval pending)"}, {"id": "DEV-007", "title": "MMIO device addresses are converted from integer constants", "guideline": "Rule 11.4", "covered": ["Rule 11.4"], "required": true, "status": "Draft (approval pending)"}, {"id": "DEV-008", "title": "ISO C signatures use `int` /* ---------- SVG helpers ---------- */
const NS = 'http://www.w3.org/2000/svg';
const svg = (w, h) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('width', '100%'); return s; };
const el = (p, tag, a, txt) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; p.appendChild(e); return e; };

function lineChart(labels, series, opts) {
  const W = 760, H = 270, L = 70, Rr = 70, T = 18, B = 46;
  const s = svg(W, H), max = opts.max || Math.max(...series.flatMap(x => x.data.filter(v => v != null)));
  const top = Math.ceil(max * 1.12 / 50) * 50;
  const x = i => L + (W - L - Rr) * (labels.length === 1 ? .5 : i / (labels.length - 1));
  const y = v => T + (H - T - B) * (1 - v / top);
  for (let k = 0; k <= 5; k++) { const v = top * k / 5; el(s, 'line', {x1: L, x2: W - Rr, y1: y(v), y2: y(v), stroke: '#edf1f6'}); el(s, 'text', {x: L - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#8a97ab'}, Math.round(v)); }

  series.forEach(se => {
    const pts = se.data.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (se.area) { const d = `M${pts[0][0]},${y(0)} ` + pts.map(p => `L${p[0]},${p[1]}`).join(' ') + ` L${pts[pts.length-1][0]},${y(0)} Z`; el(s, 'path', {d, fill: se.color, opacity: .12}); }
    el(s, 'path', {d: 'M' + pts.map(p => p.join(',')).join(' L'), fill: 'none', stroke: se.color, 'stroke-width': 3, 'stroke-linejoin': 'round', 'stroke-dasharray': se.dash || ''});
    se.data.forEach((v, i) => { if (v == null) return; el(s, 'circle', {cx: x(i), cy: y(v), r: 5, fill: '#fff', stroke: se.color, 'stroke-width': 2.5});
      if (se.label === false || (v === 0 && !se.area)) return; el(s, 'text', {x: x(i) + (se.dx || 0), y: y(v) + (se.dy || -11), 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: se.color}, fmt(v)); });
  });
  return s;
}

function donut(parts, center, sub) {
  const s = svg(200, 200), R = 78, C = 2 * Math.PI * R; let off = 0; const tot = parts.reduce((a, p) => a + p.v, 0);
  el(s, 'circle', {cx: 100, cy: 100, r: R, fill: 'none', stroke: '#edf1f6', 'stroke-width': 24});
  parts.forEach(p => { const len = C * p.v / tot; el(s, 'circle', {cx: 100, cy: 100, r: R, fill: 'none', stroke: p.c, 'stroke-width': 24, 'stroke-dasharray': `${len} ${C - len}`, 'stroke-dashoffset': -off, transform: 'rotate(-90 100 100)'}); off += len; });

  el(s, 'text', {x: 100, y: 124, 'text-anchor': 'middle', 'font-size': 11, fill: '#6b7a90'}, sub);
  return s;
}

function stackBars(rows, keys) {
  const W = 760, H = 250, L = 48, T = 14, B = 34, bw = 70; const s = svg(W, H);
  const max = Math.max(...rows.map(r => keys.reduce((a, k) => a + (r[k.k] || 0), 0))); const top = Math.ceil(max * 1.1 / 100) * 100;
  const y = v => T + (H - T - B) * (1 - v / top); const step = (W - L - 20) / rows.length;
  for (let k = 0; k <= 4; k++) { const v = top * k / 4; el(s, 'line', {x1: L, x2: W - 20, y1: y(v), y2: y(v), stroke: '#edf1f6'}); el(s, 'text', {x: L - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#8a97ab'}, Math.round(v)); }
  rows.forEach((r, i) => { let acc = 0; const cx = L + step * i + step / 2;
    keys.forEach(k => { const v = r[k.k] || 0; if (!v) return; el(s, 'rect', {x: cx - bw / 2, y: y(acc + v), width: bw, height: y(acc) - y(acc + v), fill: k.c, rx: 2}); acc += v; });
    el(s, 'text', {x: cx, y: y(acc) - 6, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#1c2738'}, fmt(acc));
    el(s, 'text', {x: cx, y: H - 12, 'text-anchor': 'middle', 'font-size': 12, fill: '#1c2738', 'font-weight': 600}, r.label); });
  return s;
}

 <div><i style="display:inline-block;width:10px;height:10px;background:#e8a317;border-radius:2px;margin-right:6px"></i><b>${dev}</b> compliant with deviation</div>
 <div><i style="display:inline-block;width:10px;height:10px;background:#b7c2d2;border-radius:2px;margin-right:6px"></i><b>${D.disapplied}</b> disapplied</div>
 <div><i style="display:inline-block;width:10px;height:10px;background:#d64545;border-radius:2px;margin-right:6px"></i><b>0</b> violated</div></div>`);
dn.appendChild(wrap);
dn.insertAdjacentHTML('beforeend', `<div class="note">${D.guidelines_total} guidelines in the GRP. The claim becomes final when the deviation records are approved.</div>`);

/* ---------- Stacked bars: all components per scan ---------- */
const sb = add('s8', 'Findings per scan by component (product analysis)', stackBars(D.scans.map(s => ({label: s.label, kernel: s.kernel, port: s.port, bsp: s.bsp, esl: s.esl_tests || 0})),
  [{k: 'kernel', c: '#9fb3cf'}, {k: 'port', c: '#2f6fd6'}, {k: 'bsp', c: '#7a5ad6'}, {k: 'esl', c: '#14a3b8'}]));
sb.insertAdjacentHTML('beforeend', `<div class="legend"><span><i style="background:#9fb3cf"></i>Upstream kernel (M7 gap analysis)</span><span><i style="background:#2f6fd6"></i>Port</span><span><i style="background:#7a5ad6"></i>BSP</span><span><i style="background:#14a3b8"></i>ESL test code (Scan 1 only in this scope)</span></div>`);

/* ---------- Compliance by category ---------- */
const catBox = add('s4', 'Compliance by MISRA category', '');
const pillCls = {Mandatory: 'p-man', Required: 'p-req', Advisory: 'p-adv'};
['Mandatory', 'Required', 'Advisory'].forEach(c => {
  const p = D.port_cat[c], k = D.kern_cat[c];
  const pc = p.total - p.deviated, kc = k.total - k.violated;
  catBox.insertAdjacentHTML('beforeend', `<div class="row"><span><span class="pill ${pillCls[c]}">${c}</span> &nbsp;${p.total} guidelines</span><span></span></div>
   <div class="row" style="margin:4px 0 3px;color:#6b7a90"><span>Port + BSP</span><b style="color:#1f9d55">100%</b></div>
   <div class="bar"><span style="width:${pc/p.total*100}%;background:#1f9d55"></span><span style="width:${p.deviated/p.total*100}%;background:#e8a317"></span></div>
   <div class="row" style="margin:7px 0 3px;color:#6b7a90"><span>Upstream kernel</span><b style="color:${k.violated?'#e8a317':'#1f9d55'}">${(kc/k.total*100).toFixed(1)}%</b></div>
   <div class="bar"><span style="width:${kc/k.total*100}%;background:#9fb3cf"></span><span style="width:${k.violated/k.total*100}%;background:#d64545"></span></div>`);
});
catBox.insertAdjacentHTML('beforeend', `<div class="legend"><span><i style="background:#1f9d55"></i>Compliant</span><span><i style="background:#e8a317"></i>With deviation</span><span><i style="background:#d64545"></i>Violated</span></div>`);

/* ---------- Structural coverage ---------- */
const cov = D.coverage;
const covPct = Math.round(cov.covered / cov.total * 100);
const covCard = add('s4', 'Structural coverage &mdash; ' + cov.metric + ' (rc1)', '');
const covWrap = $('<div class="gauge-wrap"></div>');
const covD = donut([{v: cov.covered, c: '#1f9d55'}, {v: cov.total - cov.covered, c: '#e8a317'}], covPct + '%', cov.metric + ' coverage');
covD.setAttribute('width', '190'); covWrap.appendChild(covD);
covWrap.insertAdjacentHTML('beforeend', `<div style="font-size:13px;line-height:2"><div><b>${cov.covered}/${cov.total}</b> covered lines</div><div style="color:#6b7a90">${cov.scope}<br>${cov.date}</div></div>`);
covCard.appendChild(covWrap);
covCard.insertAdjacentHTML('beforeend', `<div class="note">${cov.method}. ${cov.gaps}.<br><b style="color:#e8a317">Open:</b> ${cov.open}.</div>`);

add('s8', 'Line coverage by file &mdash; root scope (bring-up tests and demo, 7/7 passed)', `<table><tr><th>File</th><th>Covered</th><th style="width:36%"></th><th></th></tr>
 ${cov.files.map(f => { const p = Math.round(f.covered / f.total * 100); return `<tr><td style="font-family:Consolas,monospace;font-size:12px">${f.file}</td><td>${f.covered}/${f.total}</td><td><div class="bar"><span style="width:${p}%;background:${p === 100 ? '#1f9d55' : '#e8a317'}"></span></div></td><td style="text-align:right"><b>${p}%</b></td></tr>`; }).join('')}
 <tr><td><b>Total</b></td><td><b>${cov.covered}/${cov.total}</b></td><td><div class="bar"><span style="width:${covPct}%;background:#2f6fd6"></span></div></td><td style="text-align:right"><b>${covPct}%</b></td></tr></table>
 <div class="note">The timer-list wrap line of _tx_timer_interrupt is exercised by the six-configuration regression scope, not by these short tests.</div>`);

/* ---------- Process ---------- */
const pr = add('s12', 'Compliance process', '');
const st = $('<div class="steps"></div>');
D.process.forEach((p, i) => st.insertAdjacentHTML('beforeend', `<div class="step ${i === D.process.length - 1 ? 'cur' : ''}"><div class="n">${i === D.process.length - 1 ? '&hellip;' : '&#10003;'}</div><b>${p.title}</b><p>${p.text}</p></div>`));
pr.appendChild(st);

/* ---------- Tests scope ---------- */
const ts = D.tests_scope;
add('s4', 'Test-harness scope (reported separately)', `<table><tr><th>Component</th><th>Before</th><th>Now</th></tr>
 <tr><td>Port (TX_REGRESSION_TEST code) + BSP</td><td>${ts[0].port_bsp}</td><td class="up"><b>${ts[1].port_bsp}</b></td></tr>
 <tr><td>Bring-up and demo tests</td><td>${ts[0].bringup_demo}</td><td class="up"><b>${ts[1].bringup_demo}</b></td></tr>
 <tr><td>Regression harness libc</td><td>${ts[0].harness_libc}</td><td class="warn"><b>${ts[1].harness_libc}</b></td></tr>
 <tr><td>Upstream tests + kernel (Debug)</td><td>${fmt(ts[0].upstream)}</td><td>${fmt(ts[1].upstream)}</td></tr>
 <tr><td><b>Total</b></td><td><b>${fmt(ts[0].total)}</b></td><td><b>${fmt(ts[1].total)}</b></td></tr></table>
 <div class="note">The harness libc implements printf/puts/time/rand for the upstream suite under their standard names. It never ships, so its findings are recorded, not deviated.</div>`);

/* ---------- Top kernel rules ---------- */
const maxR = Math.max(...D.top_rules.map(r => r.count));
add('s4', 'Top violated guidelines &mdash; upstream kernel', `<table>${D.top_rules.map(r => `<tr><td style="width:84px"><b>${r.guideline}</b><br><span class="pill ${pillCls[r.category]||''}">${r.category}</span></td>
 <td><div style="font-size:11.5px;color:#6b7a90;margin-bottom:4px">${r.title.slice(0, 80)}${r.title.length > 80 ? '&hellip;' : ''}</div><div class="bar"><span style="width:${r.count/maxR*100}%;background:#9fb3cf"></span></div></td>
 <td style="width:40px;text-align:right"><b>${r.count}</b></td></tr>`).join('')}</table>`, `${D.kernel_violated} guidelines`);

/* ---------- Quality gates ---------- */
const q = D.quality;
const gate = (n, v, ok, sub) => `<tr><td>${n}<div style="font-size:11px;color:#6b7a90">${sub||''}</div></td><td style="text-align:right"><b>${v}</b></td><td style="width:70px"><span class="pill ${ok?'p-ok':'p-pend'}">${ok?'PASS':'OPEN'}</span></td></tr>`;
add('s4', 'Quality gates', `<table>
 ${gate('No unsuppressed port/BSP findings', D.in_scope_findings, D.in_scope_findings === 0, 'product scope, Release build')}
 ${gate('Regression suite', `${q.regression.passed}/${q.regression.total}`, true, `${q.regression.configs} ThreadX configurations`)}
 ${gate('Parallel stress', `${q.stress.passed}/${q.stress.total}`, true, q.stress.before)}
 ${gate('Root bring-up and demo tests', `${q.root_tests.passed}/${q.root_tests.total}`, true, 'Debug and Release')}
 ${gate('Structural coverage (' + cov.metric + ')', covPct + '% (' + cov.covered + '/' + cov.total + ')', true, cov.open)}
 ${gate('Tool validation (seeded)', `${q.tool_validation.passed}/${q.tool_validation.total}`, true, 'Parasoft C/C++test, T2')}
 ${gate('Freestanding libc check', 'nm -u empty', true, 'DEV-001 condition 3, in CI')}
 ${gate('Deviation approvals', `${D.devs.length - pend}/${D.devs.length}`, pend === 0, 'Tech Lead / Safety Manager')}
</table>`);

/* ---------- Deviations ---------- */
add('s12', 'Deviation records', `<table><tr><th>ID</th><th>Guideline</th><th>Subject</th><th>Approval needed</th><th>Status</th></tr>
 ${D.devs.map(d => `<tr><td><b>${d.id}</b></td><td>${d.guideline}</td><td>${d.title}</td><td>${d.required ? 'Tech Lead + Safety Manager' : 'Tech Lead'}</td>
 <td><span class="pill ${/^Approved/i.test(d.status) ? 'p-ok' : 'p-pend'}">${d.status.replace(/\(see.*\)/, '').slice(0, 60)}</span></td></tr>`).join('')}</table>`);

main.insertAdjacentHTML('beforeend', `<div class="s12 note" style="text-align:center">Generated by tools/parasoft/dashboard.py from the Parasoft SARIF reports, docs/misra/grp.md and docs/misra/deviations/. Scan history: docs/misra/reports/history.json. Coverage data: docs/verification/coverage.md. No certification claim.</div>`);
</script>
</body>
</html>
